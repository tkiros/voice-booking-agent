[project]
name = "voice-booking-agent"
version = "0.1.0"
description = "Booking backend for a Vapi voice agent: no double-bookings, idempotent retries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
