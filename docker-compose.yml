# PROJECT_NAME comes from .env; it keeps this stack's containers and volume apart from other projects.
name: ${PROJECT_NAME:-voice-booking}

services:
  db:
    # ParadeDB = Postgres 17 + extras. This project only needs plain Postgres + btree_gist (contrib).
    # Pinned: bump on purpose, not by accident.
    image: paradedb/paradedb:0.26.7-pg17
    environment:  # local dev only; the port is bound to 127.0.0.1
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount the file, not the folder: the image keeps its own 10_bootstrap_paradedb.sh there.
      - ./db/init/20_app_schema.sql:/docker-entrypoint-initdb.d/20_app_schema.sql:ro
    healthcheck:
      # TCP, not the socket: init scripts run on a socket-only temporary server, so a socket
      # check reports "healthy" before 20_app_schema.sql has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app  # service name inside the network
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
